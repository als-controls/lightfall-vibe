[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightfall-vibe"
dynamic = ["version"]
description = "Vibe mode: music-reactive UI effects for Lightfall (demo toy)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "LEGAL.md"]
requires-python = ">=3.11"
authors = [{ name = "NCS Development Team" }]
dependencies = [
    "lightfall",
    "soundcard>=0.4",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.2",
]

[project.entry-points."lightfall.plugins"]
lightfall_vibe = "lightfall_vibe.manifest:manifest"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_vibe"]

[tool.ruff.lint]
# CI installs ruff unpinned, and ruff 0.16.0 grew its default rule set from
# 59 to 413 rules. Keep the pre-0.16 defaults this code was written against.
select = ["E4", "E7", "E9", "F"]
